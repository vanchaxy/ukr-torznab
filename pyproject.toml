[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ukr-torznab"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]==2.0.49",
    "httpx==0.28.1",
    "httpx-limiter[aiolimiter]==0.6.0",
    "lxml==6.0.3",
    "pydantic==2.12.5",
    "fastapi==0.135.3",
    "aiosqlite==0.22.1",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "openai==2.31.0",
    "libtorrent==2.0.11",
    "html2text==2025.4.15",
    "decancer-py==0.4.1",
    "psycopg2-binary==2.9.11",
    "uvicorn[standard]==0.44.0",
]
optional-dependencies.dev = [
    "mypy==1.20.0",
    "ruff==0.15.10",
]

[tool.hatch.build.targets.wheel]
packages = ["ukr_torznab"]

[tool.hatch.version]
path = "ukr_torznab/__init__.py"

[tool.ruff]
line-length = 100
