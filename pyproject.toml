[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ukr-torznab"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]==2.1.6",
    "httpx==0.28.1",
    "httpx-limiter[aiolimiter]==0.6.1",
    "lxml==6.1.3",
    "pydantic==2.14.1",
    "fastapi==0.161.1",
    "aiosqlite==0.22.1",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "openai==3.37.0",
    "libtorrent==2.1.1",
    "html2text==2025.4.15",
    "decancer-py==0.4.1",
    "psycopg2-binary==2.9.13",
    "uvicorn[standard]==0.54.0",
]
optional-dependencies.dev = [
    "mypy==2.4.0",
    "ruff==0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["ukr_torznab"]

[tool.hatch.version]
path = "ukr_torznab/__init__.py"

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]
